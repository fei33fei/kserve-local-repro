apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-pv
spec:
  capacity:
    storage: 100Mi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/models
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
  namespace: default
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 100Mi
  storageClassName: ""       # 置空：否则会去动态供应
  volumeName: model-pv       # 显式绑定上面的 PV
